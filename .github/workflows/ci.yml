name: Validate both applications
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    # Keep browser dependencies on a reproducible runner image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm security
      - run: pnpm exec turbo build --filter=@mfu/users
      - run: pnpm exec turbo build --filter=@mfu/admin
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
